<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WOL Hardware - Tienda especializada en componentes de PC, placas de video, procesadores y periféricos de alto rendimiento.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <title>Detalle de producto | WOL Hardware</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/carrito.js" defer></script>
    <script src="js/detalle.js" defer></script>
  </head>
  <body>
    <!-- Encabezado con navegación consistente -->
    <header class="header-centrado">
      <a class="logo" href="index.html" aria-label="WOL Hardware - Inicio">WOL</a>
      <nav aria-label="Navegación principal">
        <ul class="nav-centrado">
          <li><a href="index.html">Inicio</a></li>
          <li>
            <a href="catalogo.html" class="link-activo" aria-current="page">Catálogo</a>
          </li>
          <li>
            <a href="carrito.html" class="nav-carrito">
              Carrito
              <span class="carrito-contador" data-carrito-contador>0</span>
            </a>
          </li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article class="detalle-producto">
        <div
          id="detalle-estado"
          class="estado-catalogo"
          role="status"
          aria-live="polite"
        >
          Cargando producto...
        </div>

        <div id="detalle-contenido" hidden>
          <div class="detalle-superior">
            <figure class="detalle-imagen">
              <img id="detalle-imagen" src="" alt="" loading="lazy" />
            </figure>

            <section class="detalle-info" aria-label="Información general del producto">
              <div class="detalle-etiquetas">
                <span class="tag-categoria" id="detalle-categoria"></span>
                <span class="badge badge-oferta badge-detalle" id="detalle-badge-oferta" hidden>
                  OFERTA
                </span>
              </div>
              <h1 id="detalle-titulo"></h1>
              <p class="detalle-descripcion" id="detalle-descripcion"></p>
              <p class="precio" id="detalle-precio">
                <span id="detalle-precio-actual"></span>
                <span class="precio-tachado" id="detalle-precio-original" hidden></span>
              </p>
              <button
                type="button"
                class="btn-comprar"
                id="btn-agregar-carrito"
                data-agregar-carrito
                data-id=""
                data-nombre=""
                data-precio="0"
                data-imagen=""
                data-categoria=""
              >
                Agregar al carrito 🛒
              </button>
            </section>
          </div>

          <section class="detalle-ficha" aria-label="Ficha técnica del producto">
            <h2>Ficha técnica</h2>
            <table class="tabla-carrito">
              <caption id="detalle-ficha-caption"></caption>
              <tbody id="detalle-especificaciones"></tbody>
            </table>
          </section>

          <section class="detalle-volver" aria-label="Enlaces relacionados">
            <a href="catalogo.html" class="btn-detalle">← Volver al catálogo</a>
          </section>
        </div>
      </article>
    </main>

    <footer>
      <div class="footer-links">
        <a href="contact.html">Contacto</a>
        <a href="contact.html#preguntas-frecuentes">Preguntas frecuentes</a>
        <a href="contact.html#envios">Envíos</a>
        <a href="contact.html#terminos">Términos y condiciones</a>
      </div>
      <p>© 2026 WOL Hardware. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
