<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo Completo | WOL Hardware</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/catalogo.js" defer></script>
  </head>
  <body>
    <!-- Header con enlace activo -->
    <header class="header-centrado">
      <h1 class="marca-titulo">WOL</h1>
      <nav aria-label="Navegación principal">
        <ul class="nav-centrado">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="Catalogo.html" class="nav-activo">Catálogo</a></li>
          <li><a href="carrito.html">Carrito</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section
        aria-label="Explorador de inventario"
        class="catalogo-header-bloque"
      >
        <div class="seccion-header">
          <h2>📦 Inventario General</h2>
          <p>
            Listado completo de componentes y periféricos en stock con garantía
            oficial.
          </p>
        </div>

        <!-- Filtros por categoría: los maneja js/catalogo.js -->
        <nav class="filtros-catalogo" aria-label="Filtro por categoría de hardware">
          <button type="button" class="btn-filtro activo" data-categoria="" aria-pressed="true">
            Todos los productos
          </button>
          <button type="button" class="btn-filtro" data-categoria="Placas de Video" aria-pressed="false">
            Placas de Video
          </button>
          <button type="button" class="btn-filtro" data-categoria="Procesadores" aria-pressed="false">
            Procesadores
          </button>
          <button type="button" class="btn-filtro" data-categoria="Memorias RAM" aria-pressed="false">
            Memorias RAM
          </button>
          <button type="button" class="btn-filtro" data-categoria="Gabinetes" aria-pressed="false">
            Gabinetes
          </button>
          <button type="button" class="btn-filtro" data-categoria="Teclados y Mouse" aria-pressed="false">
            Periféricos
          </button>
          <button type="button" class="btn-filtro" data-categoria="Coolers" aria-pressed="false">
            Refrigeración
          </button>
          <button type="button" class="btn-filtro" data-categoria="Monitores" aria-pressed="false">
            Monitores
          </button>
        </nav>
      </section>

      <!-- Grilla de inventario: se completa dinámicamente desde Supabase -->
      <section aria-label="Productos en stock">
        <p id="catalogo-estado" class="estado-catalogo" role="status" aria-live="polite">
          Cargando productos...
        </p>
        <div class="grid-inventario" id="grid-inventario"></div>
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <a href="contact.html">Contacto</a>
        <a href="contact.html#faq">Preguntas frecuentes</a>
        <a href="contact.html#envios">Envíos</a>
        <a href="contact.html#terminos">Términos y condiciones</a>
      </div>
      <p>© 2026 WOL Hardware. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
