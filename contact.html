<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto y Soporte | WOL Hardware</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header-centrado">
    <h1 class="marca-titulo">WOL</h1>
    <nav aria-label="Navegación principal">
      <ul class="nav-centrado">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="Catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="contact.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-label="Formulario de contacto" class="contacto-seccion">
      <h2>📬 Contactanos</h2>
      <p>Completá el formulario para consultas técnicas, armado de presupuestos o estado de pedidos.</p>

      <form action="#" method="post" class="form-contacto">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Marcos Prokopowycz" required>
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="usuario@correo.com" required>
        </div>

        <div class="campo">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" name="asunto" placeholder="Motivo de la consulta" required>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu consulta técnica aquí..." required></textarea>
        </div>

        <button type="submit" class="btn-comprar">Enviar mensaje</button>
      </form>
    </section>

    <section aria-label="Ubicación física del local" class="mapa-seccion">
      <h2>📍 Nuestro Local</h2>
      <div class="iframe-contenedor">
        <iframe
          title="Ubicación del local en Google Maps"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.016887889549!2d-58.381570!3d-34.603738!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzTCsDM2JzEzLjQiUyA1OMKwMjInNTMuNyJX!5e0!3m2!1ses!2sar!4v1600000000000!5m2!1ses!2sar"
          loading="lazy">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <a href="contact.html">Contacto</a>
      <a href="contact.html#faq">Preguntas frecuentes</a>
      <a href="contact.html#envios">Envíos</a>
      <a href="contact.html#terminos">Términos y condiciones</a>
    </div>
    <p>© 2026 WOL Hardware. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
