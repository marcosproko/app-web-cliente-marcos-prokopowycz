<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | Mi Tienda</title>
</head>
<body>
  <header>
    <p>WOL</p>
    <nav aria-label="Navegación principal">
      <ul>
      </ul>
      <form action="#" method="get" role="search">
        <label for="busqueda">Buscar productos</label>
        <input type="search" id="busqueda" name="q" placeholder="Buscar...">
        <button type="submit">Buscar</button>
      </form>
    </nav>
  </header>

  <main>
    <section aria-label="Carrito de compras">
      <h1>Carrito de compras</h1>

      <table>
        <caption>Resumen de productos seleccionados en el carrito</caption>
        <thead>
          <tr>
            <th scope="col">Producto</th>
            <th scope="col">Precio</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Producto 1</td>
            <td>$1000</td>
            <td>1</td>
            <td>$1000</td>
          </tr>
          <tr>
            <td>Producto 2</td>
            <td>$2000</td>
            <td>2</td>
            <td>$4000</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="3">Total</th>
            <td>$5000</td>
          </tr>
        </tfoot>
      </table>
      <div>
        <button type="button">Vaciar carrito</button>
        <button type="button">Iniciar compra</button>
      </div>
    </section>
  </main>
